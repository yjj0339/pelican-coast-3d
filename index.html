<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#BFE4F5">
<title>鹈鹕海岸骑行 · 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232EC4A6'/%3E%3Ccircle cx='16' cy='14' r='7' fill='%23F8F4EB'/%3E%3Cpath d='M20 13 L30 16 L20 18 Z' fill='%23F2A93B'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stage"></canvas>

<!-- 载入页 -->
<div id="loading">
  <div class="load-card">
    <div class="load-bird">
      <svg viewBox="0 0 120 90" width="120" height="90" aria-hidden="true">
        <ellipse cx="52" cy="52" rx="26" ry="18" fill="#F8F4EB"/>
        <path d="M66 44 Q74 30 82 28 Q90 27 92 33 Q86 34 84 38 Q96 40 104 44 Q92 50 80 48 Q72 47 66 44 Z" fill="#F8F4EB"/>
        <path d="M90 36 L116 42 L92 46 Z" fill="#F2A93B"/>
        <path d="M90 44 Q100 52 108 46 Q100 44 92 42 Z" fill="#F09A6E"/>
        <circle cx="86" cy="33" r="2.4" fill="#1B1D20"/>
        <circle cx="40" cy="76" r="10" fill="none" stroke="#2EC4A6" stroke-width="3"/>
        <circle cx="76" cy="76" r="10" fill="none" stroke="#2EC4A6" stroke-width="3"/>
        <path d="M40 76 L52 60 L70 62 L76 76 M52 60 L58 76 L40 76" fill="none" stroke="#2EC4A6" stroke-width="3"/>
      </svg>
    </div>
    <h1>鹈鹕海岸骑行</h1>
    <p class="load-sub">PELICAN COAST RIDE · 3D</p>
    <div class="load-bar"><i id="load-fill"></i></div>
    <p id="load-tip" class="load-tip">正在给自行车打气…</p>
  </div>
</div>

<!-- 标题卡 -->
<div id="title-card" class="card">
  <h1>鹈鹕海岸骑行</h1>
  <p>PELICAN COAST RIDE · 3D</p>
</div>

<!-- 里程面板 -->
<div id="dash" class="card">
  <div class="dash-row"><span class="dash-k">里程</span><b id="dash-dist">0</b><span class="dash-u">m</span></div>
  <div class="dash-row"><span class="dash-k">速度</span><b id="dash-speed">0.0</b><span class="dash-u">km/h</span></div>
</div>

<!-- 操作栏 -->
<div id="bar">
  <button id="btn-cam" class="btn" title="切换视角"><span>视角</span></button>
  <button id="btn-slow" class="btn" title="减速">➖<span>减速</span></button>
  <div id="speed-tag" class="btn tag">16 km/h</div>
  <button id="btn-fast" class="btn" title="加速">➕<span>加速</span></button>
  <button id="btn-bell" class="btn" title="车铃">🔔<span>车铃</span></button>
  <button id="btn-hi" class="btn" title="打招呼">📯<span>打招呼</span></button>
</div>

<!-- 提示 -->
<div id="hint" class="card">点按画面 = 打招呼 · 双击 = 跳一下 · 拖拽 = 自由视角 · 方向键 / A D 转向</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
